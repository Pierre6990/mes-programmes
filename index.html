<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c81">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mes Programmes</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--tx:#14202e;--mut:#64748b;--pri:#0f4c81;--pri2:#1d7fd6;--ok:#16a34a;--bad:#dc2626;--bd:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0b1320;--card:#142033;--tx:#e8eef6;--mut:#94a3b8;--pri:#3b8ee0;--pri2:#5aa6f0;--bd:#223249}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-bottom:96px}
header{background:linear-gradient(135deg,#0f4c81,#1d7fd6);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 22px}
header h1{margin:0;font-size:18px;font-weight:600;opacity:.9}
.next-l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-top:14px}
.next-t{font-size:28px;font-weight:700;line-height:1.15;margin:4px 0}
.next-w{font-size:16px;opacity:.95}
.next-c{display:inline-block;margin-top:10px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:20px;font-size:14px}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sec{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--mut)}
.badge{font-size:12px;background:var(--bd);color:var(--mut);border-radius:10px;padding:2px 8px}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--pri);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--pri);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--bad);border:1px solid var(--bd)}
button.sm{padding:6px 10px;font-size:13px}
.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
@media(prefers-color-scheme:dark){.warn{background:#2a1a0c;border-color:#6b3a14;color:#fdba74}}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:60px;height:60px;border-radius:30px;font-size:32px;line-height:1;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:640px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 11px;border-radius:18px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ring{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0f4c81,#7c3aed);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.ring.on{display:flex}
.ring .bell{font-size:72px;animation:sh .6s infinite}
@keyframes sh{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.ring h2{font-size:34px;margin:10px 0 6px}
.ring p{font-size:18px;opacity:.9;margin:4px 0}
.ring .bt{display:flex;gap:12px;margin-top:30px;width:100%;max-width:380px}
.ring .bt button{flex:1;padding:16px;font-size:18px;background:#fff;color:#0f4c81}
.ring .bt button.s2{background:rgba(255,255,255,.2);color:#fff}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
</style>
</head>
<body>
<header>
  <h1>🔔 Mes Programmes</h1>
  <div class="next-l">Prochain programme</div>
  <div class="next-t" id="nT">—</div>
  <div class="next-w" id="nW"></div>
  <span class="next-c" id="nC" style="display:none"></span>
</header>
<main>
  <div id="setup"></div>
  <div id="missed"></div>
  <div class="sec">À venir</div>
  <div id="list"></div>
  <div class="sec">Réglages</div>
  <div class="card">
    <div class="row"><div class="grow"><div class="t">Garder l'écran allumé</div><div class="s">Recommandé : l'alarme sonne de façon fiable quand l'application est ouverte.</div></div><input type="checkbox" id="wl" style="width:auto"></div>
  </div>
  <div class="card row" style="flex-wrap:wrap">
    <button class="g sm" id="bTest">Tester la sonnerie</button>
    <button class="g sm" id="bAll">Tout exporter vers l'agenda</button>
    <button class="g sm" id="bBk">Sauvegarder</button>
    <button class="g sm" id="bRs">Restaurer</button>
    <input type="file" id="fRs" accept=".json" style="display:none">
  </div>
</main>

<button class="fab" id="bAdd" aria-label="Ajouter">+</button>

<div class="sheet" id="sheet"><div>
  <h2 style="margin:0 0 4px" id="shT">Nouveau programme</h2>
  <label>Titre</label><input id="fT" placeholder="Ex. Réunion des jeunes" maxlength="80">
  <div class="two">
    <div><label>Date (début)</label><input type="date" id="fD"></div>
    <div><label>Heure</label><input type="time" id="fH"></div>
  </div>
  <label>Répétition</label>
  <select id="fR"><option value="none">Une seule fois</option><option value="daily">Tous les jours</option><option value="days">Certains jours de la semaine</option></select>
  <div class="chips" id="fDays" style="margin-top:8px;display:none"></div>
  <label>M'avertir avant</label>
  <select id="fL"><option value="0">À l'heure exacte</option><option value="5">5 minutes avant</option><option value="10">10 minutes avant</option><option value="15">15 minutes avant</option><option value="30">30 minutes avant</option><option value="60">1 heure avant</option></select>
  <label>Note (facultatif)</label><textarea id="fN" rows="2" maxlength="200"></textarea>
  <div class="row" style="margin-top:16px"><button class="g grow" id="fX">Annuler</button><button class="grow" id="fS">Enregistrer</button></div>
</div></div>

<div class="ring" id="ring">
  <div class="bell">🔔</div>
  <p id="rS"></p>
  <h2 id="rT"></h2>
  <p id="rN"></p>
  <p id="rM" style="font-size:14px"></p>
  <div class="bt"><button class="s2" id="rSn">Répéter 5 min</button><button id="rOk">Arrêter</button></div>
</div>

<script>
const $=s=>document.getElementById(s);
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let progs=LS('progs',[]), fired=LS('fired',{}), missed=LS('missed',[]), snoozes=LS('snoozes',[]);
let ringQ=[], editId=null, swReg=null;
const JN=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'], JO=[1,2,3,4,5,6,0];
const JL=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const mk=(day,h)=>{const[a,b,c]=day.split('-').map(Number),[H,M]=h.split(':').map(Number);return new Date(a,b-1,c,H,M)};
const hm=d=>p2(d.getHours())+':'+p2(d.getMinutes());
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function occOnDay(p,day){ // day: Date
  const k=ymd(day);
  if(k<p.date)return null;
  if(p.repeat==='none'&&k!==p.date)return null;
  if(p.repeat==='days'&&!(p.days||[]).includes(day.getDay()))return null;
  return mk(k,p.time);
}
function nextOcc(p,now){
  const base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const max=p.repeat==='none'?400:60;
  for(let i=0;i<max;i++){
    const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+i);
    const o=occOnDay(p,d);
    if(o&&o>now)return o;
  }
  return null;
}
function dayLabel(d,now){
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const d0=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((d0-t0)/864e5);
  if(diff===0)return "Aujourd'hui";
  if(diff===1)return 'Demain';
  return JL[d.getDay()]+' '+d.getDate()+'/'+p2(d.getMonth()+1);
}
function countdown(ms){
  const m=Math.max(0,Math.floor(ms/6e4));
  if(m<1)return 'dans moins d\'une minute';
  if(m<60)return 'dans '+m+' min';
  const h=Math.floor(m/60),r=m%60;
  if(h<24)return 'dans '+h+' h'+(r?' '+p2(r):'');
  const j=Math.floor(h/24);return 'dans '+j+' jour'+(j>1?'s':'');
}
function repLabel(p){
  if(p.repeat==='daily')return 'Tous les jours';
  if(p.repeat==='days')return JO.filter(i=>(p.days||[]).includes(i)).map(i=>JN[i]).join(' ');
  return 'Une fois';
}

/* ---------- Affichage ---------- */
function render(){
  const now=new Date();
  const items=progs.map(p=>({p,o:nextOcc(p,now)})).filter(x=>x.o).sort((a,b)=>a.o-b.o);
  const n=items[0];
  if(n){
    $('nT').textContent=n.p.title;
    $('nW').textContent=dayLabel(n.o,now)+' à '+hm(n.o);
    $('nC').style.display='inline-block';$('nC').textContent=countdown(n.o-now);
    document.title=hm(n.o)+' · '+n.p.title;
    try{navigator.setAppBadge&&navigator.setAppBadge(items.filter(x=>ymd(x.o)===ymd(now)).length||0)}catch(e){}
  }else{
    $('nT').textContent='Aucun programme';$('nW').textContent='Appuyez sur + pour en ajouter';$('nC').style.display='none';document.title='Mes Programmes';
  }
  $('list').innerHTML=items.length?items.map(({p,o})=>`
    <div class="card"><div class="row">
      <div class="grow"><div class="t">${esc(p.title)}</div>
      <div class="s">${dayLabel(o,now)} à ${hm(o)} · ${repLabel(p)}${p.lead?' · alerte '+p.lead+' min avant':''}</div>
      ${p.note?`<div class="s">${esc(p.note)}</div>`:''}</div>
    </div>
    <div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">
      <button class="g sm" onclick="edit('${p.id}')">Modifier</button>
      <button class="g sm" onclick="exportOne('${p.id}')">📅 Agenda</button>
      <button class="d sm" onclick="del('${p.id}')">Supprimer</button>
    </div></div>`).join(''):'<div class="empty">Aucun programme à venir.</div>';
  // programmes passés (ponctuels expirés)
  $('missed').innerHTML=missed.length?`<div class="sec">Programmes manqués</div>`+missed.map(m=>`
    <div class="card warn"><div class="t">${esc(m.title)}</div><div class="s" style="color:inherit">Prévu ${dayLabel(new Date(m.at),now)} à ${hm(new Date(m.at))}</div></div>`).join('')+`<button class="g sm" onclick="clearMissed()">Effacer les manqués</button>`:'';
  // bandeau d'activation
  let s='';
  if('Notification' in window&&Notification.permission==='default')
    s+=`<div class="card warn"><div class="t">Activer les notifications</div><div class="s" style="color:inherit">Pour être alerté même quand l'écran est éteint.</div><button class="sm" style="margin-top:8px" onclick="askNotif()">Autoriser</button></div>`;
  if(audioCtx()&&audioCtx().state!=='running')
    s+=`<div class="card warn"><div class="t">Activer le son</div><div class="s" style="color:inherit">Touchez le bouton une fois par ouverture de l'application.</div><button class="sm" style="margin-top:8px" onclick="unlock()">Activer la sonnerie</button></div>`;
  $('setup').innerHTML=s;
}
function clearMissed(){missed=[];SV('missed',missed);render()}
async function askNotif(){try{await Notification.requestPermission()}catch(e){}render()}

/* ---------- Sonnerie ---------- */
let AC=null,ringTimer=null,vibTimer=null;
function audioCtx(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  return AC;
}
function unlock(){const a=audioCtx();if(a&&a.resume)a.resume().then(render).catch(()=>{});render()}
document.addEventListener('pointerdown',()=>{const a=audioCtx();if(a&&a.state!=='running')a.resume().then(render).catch(()=>{})},{passive:true});
function beep(t0,f,d,v){
  const a=audioCtx();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type='square';o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.setValueAtTime(v,t0+d-.02);g.gain.linearRampToValueAtTime(0,t0+d);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.02);
}
function phrase(){
  const a=audioCtx();if(!a)return;
  const t=a.currentTime+.05;
  for(let i=0;i<4;i++){beep(t+i*.25,i%2?1175:880,.18,.35)}
  for(let i=0;i<4;i++){beep(t+1.4+i*.25,i%2?1175:880,.18,.35)}
}
function startRing(){
  stopRing();
  const a=audioCtx();if(a&&a.resume)a.resume();
  phrase();ringTimer=setInterval(phrase,3000);
  const v=()=>{try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400])}catch(e){}};
  v();vibTimer=setInterval(v,2500);
}
function stopRing(){clearInterval(ringTimer);clearInterval(vibTimer);ringTimer=vibTimer=null;try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}

function showRing(){
  const r=ringQ[0];
  if(!r){$('ring').classList.remove('on');stopRing();return}
  $('rS').textContent=r.lead?`Dans ${r.lead} min — ${hm(new Date(r.at))}`:`Il est ${hm(new Date(r.at))}`;
  $('rT').textContent=r.title;$('rN').textContent=r.note||'';
  $('rM').textContent=ringQ.length>1?`+ ${ringQ.length-1} autre(s) alarme(s)`:'';
  $('ring').classList.add('on');startRing();
}
function trigger(r){
  ringQ.push(r);
  if(ringQ.length===1)showRing();else $('rM').textContent=`+ ${ringQ.length-1} autre(s) alarme(s)`;
  notify(r);
}
function notify(r){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const opt={body:(r.lead?`Dans ${r.lead} min — `:'')+hm(new Date(r.at))+(r.note?' · '+r.note:''),icon:'icon-192.png',badge:'icon-192.png',tag:'prog-'+r.key,requireInteraction:true,vibrate:[400,200,400,200,400],renotify:true};
    if(swReg&&swReg.showNotification)swReg.showNotification('🔔 '+r.title,opt);
    else new Notification('🔔 '+r.title,opt);
  }catch(e){}
}
$('rOk').onclick=()=>{ringQ.shift();showRing()};
$('rSn').onclick=()=>{
  const r=ringQ.shift();
  if(r){snoozes.push({title:r.title,note:r.note,at:r.at,lead:0,until:Date.now()+5*6e4,key:r.key+'s'+Date.now()});SV('snoozes',snoozes)}
  showRing();
};
$('bTest').onclick=()=>{unlock();trigger({title:'Test de la sonnerie',note:'Tout fonctionne !',at:Date.now(),lead:0,key:'test'+Date.now()})};

/* ---------- Vérification chaque seconde ---------- */
function tick(){
  const now=new Date(),nm=now.getTime();
  let changed=false;
  for(const p of progs){
    const lead=(p.lead||0)*6e4;
    for(let i=-1;i<=1;i++){
      const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
      const o=occOnDay(p,d);if(!o)continue;
      const at=o.getTime()-lead,key=p.id+'|'+o.getTime();
      if(at>nm||fired[key])continue;
      fired[key]=nm;changed=true;
      if(nm-at<=120000)trigger({title:p.title,note:p.note,at:o.getTime(),lead:p.lead||0,key});
      else if(nm-o.getTime()<12*36e5&&nm>=o.getTime()){missed.push({title:p.title,at:o.getTime()})}
    }
  }
  for(let i=snoozes.length-1;i>=0;i--){
    if(snoozes[i].until<=nm){const s=snoozes.splice(i,1)[0];changed=true;trigger(s)}
  }
  if(changed){
    for(const k in fired)if(nm-fired[k]>3*864e5)delete fired[k];
    missed=missed.filter(m=>nm-m.at<48*36e5);
    SV('fired',fired);SV('missed',missed);SV('snoozes',snoozes);render();
  }
}
setInterval(tick,1000);
setInterval(render,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();render();if($('wl').checked)lock()}});

/* ---------- Formulaire ---------- */
function buildChips(sel){
  $('fDays').innerHTML=JO.map(i=>`<button type="button" class="chip ${sel.includes(i)?'on':''}" data-d="${i}">${JN[i]}</button>`).join('');
  $('fDays').querySelectorAll('.chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
}
$('fR').onchange=()=>{$('fDays').style.display=$('fR').value==='days'?'flex':'none'};
function openForm(p){
  editId=p?p.id:null;
  $('shT').textContent=p?'Modifier le programme':'Nouveau programme';
  const n=new Date(Date.now()+36e5);
  $('fT').value=p?p.title:'';
  $('fD').value=p?p.date:ymd(new Date());
  $('fH').value=p?p.time:p2(n.getHours())+':00';
  $('fR').value=p?p.repeat:'none';
  $('fL').value=String(p?p.lead||0:0);
  $('fN').value=p?p.note||'':'';
  buildChips(p&&p.days?p.days:[]);
  $('fDays').style.display=$('fR').value==='days'?'flex':'none';
  $('sheet').classList.add('on');
}
function edit(id){openForm(progs.find(p=>p.id===id))}
function del(id){if(confirm('Supprimer ce programme ?')){progs=progs.filter(p=>p.id!==id);SV('progs',progs);render()}}
$('bAdd').onclick=()=>{unlock();openForm(null)};
$('fX').onclick=()=>$('sheet').classList.remove('on');
$('fS').onclick=()=>{
  const title=$('fT').value.trim();
  if(!title){alert('Donnez un titre au programme.');return}
  if(!$('fD').value||!$('fH').value){alert('Choisissez la date et l\'heure.');return}
  const rep=$('fR').value;
  const days=[...$('fDays').querySelectorAll('.chip.on')].map(c=>Number(c.dataset.d));
  if(rep==='days'&&!days.length){alert('Choisissez au moins un jour.');return}
  const p={id:editId||('p'+Date.now()),title,date:$('fD').value,time:$('fH').value,repeat:rep,days:rep==='days'?days:[],lead:Number($('fL').value),note:$('fN').value.trim()};
  const i=progs.findIndex(x=>x.id===p.id);
  if(i>=0)progs[i]=p;else progs.push(p);
  for(const k in fired)if(k.startsWith(p.id+'|'))delete fired[k];
  SV('progs',progs);SV('fired',fired);
  $('sheet').classList.remove('on');render();tick();
  if('Notification' in window&&Notification.permission==='default')askNotif();
};

/* ---------- Export agenda (.ics) ---------- */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsDT(d){return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00'}
function vevent(p){
  const start=mk(p.date,p.time),end=new Date(start.getTime()+30*6e4);
  const L=['BEGIN:VEVENT','UID:'+p.id+'@mes-programmes','DTSTAMP:'+icsDT(new Date())+'Z','DTSTART:'+icsDT(start),'DTEND:'+icsDT(end),'SUMMARY:'+icsEsc(p.title)];
  if(p.note)L.push('DESCRIPTION:'+icsEsc(p.note));
  if(p.repeat==='daily')L.push('RRULE:FREQ=DAILY');
  if(p.repeat==='days')L.push('RRULE:FREQ=WEEKLY;BYDAY='+p.days.map(i=>['SU','MO','TU','WE','TH','FR','SA'][i]).join(','));
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(p.title),'TRIGGER:-PT'+(p.lead||0)+'M','END:VALARM','END:VEVENT');
  return L.join('\r\n');
}
function dl(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function ics(list){return 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Mes Programmes//FR\r\nCALSCALE:GREGORIAN\r\n'+list.map(vevent).join('\r\n')+'\r\nEND:VCALENDAR'}
function exportOne(id){const p=progs.find(x=>x.id===id);if(p)dl('programme.ics',ics([p]),'text/calendar')}
$('bAll').onclick=()=>{if(!progs.length){alert('Aucun programme.');return}dl('mes-programmes.ics',ics(progs),'text/calendar')};

/* ---------- Sauvegarde ---------- */
$('bBk').onclick=()=>dl('sauvegarde-programmes.json',JSON.stringify(progs,null,2),'application/json');
$('bRs').onclick=()=>$('fRs').click();
$('fRs').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;progs=a;SV('progs',progs);render();alert('Programmes restaurés.')}catch(x){alert('Fichier invalide.')}};
  r.readAsText(f);e.target.value='';
};

/* ---------- Écran allumé ---------- */
let wlk=null;
async function lock(){try{if('wakeLock' in navigator)wlk=await navigator.wakeLock.request('screen')}catch(e){}}
$('wl').checked=LS('wl',false);
$('wl').onchange=()=>{SV('wl',$('wl').checked);if($('wl').checked)lock();else if(wlk){wlk.release();wlk=null}};
if($('wl').checked)lock();

/* ---------- Service worker ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
  navigator.serviceWorker.ready.then(r=>{swReg=r});
}
render();tick();
</script>
</body>
</html>
